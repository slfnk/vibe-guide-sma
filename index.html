<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Vibe Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>

  /* =================== THEME VARIABLES =================== */
  :root {
    --bg: #FAF9F6;
    --bg-rgb: 250,249,246;
    --text: #1A1A1A;
    --text-2: #5C5C5C;
    --text-3: #8A8A8A;
    --border: #E0DDD8;
    --hover: #F3F1ED;
    --progress: #2AAA8A;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --card-blur: 0px;
    --card-alpha: 0.85;
    --pin-size: 16px;
  }

  /* =================== DARK THEME =================== */
  body.dark {
    --bg: #1A1A1A;
    --text: #E8E4DE;
    --text-2: #A8A8A8;
    --text-3: #6B6B6B;
    --border: #333;
    --hover: #252525;
  }
  body.dark .card { background: rgba(37, 37, 37, 0.55); }
  body.dark .card-body .card-desc { color: #ddd; }
  body.dark .card-body .card-cat { color: #777; }
  body.dark .card-thumb-float { background: #333; }
  body.dark .entry-thumb-placeholder { background: #333; }
  body.dark .mobile-toggle { background: #333; }
  body.dark .map-filter-bar { background: #1A1A1A; border-color: #333; }
  body.dark .filter-btn { border-color: #444; color: var(--text-2); }
  body.dark .filter-btn:hover { background: #333; }
  body.dark .entry-links a { border-color: #444; color: var(--text-2); }
  body.dark .entry-links a:hover { background: var(--text); color: var(--bg); }
  body.dark .pin-label { background: rgba(28, 28, 30, 0.92); color: #fff; }

  /* =================== BASE =================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow: hidden;
    height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* =================== TWO-COLUMN LAYOUT =================== */
  .layout { display: flex; height: 100vh; }
  .col-left {
    width: 50%;
    overflow-y: auto;
    position: relative;
  }
  .col-left::-webkit-scrollbar { width: 4px; }
  .col-left::-webkit-scrollbar-track { background: transparent; }
  .col-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .col-right { width: 50%; position: relative; }
  #map { width: 100%; height: 100%; }

  /* =================== PROGRESS BAR =================== */
  .progress-bar {
    position: sticky;
    top: 0;
    z-index: 15;
    height: 3px;
    background: var(--border);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--progress);
    transition: width 0.12s ease-out;
  }

  /* =================== TOP BAR =================== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 2.5rem;
  }
  .top-bar .updated {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--progress);
  }
  .guiides-brand {
    font-family: var(--sans);
    font-size: 0.62rem;
    color: #D95B43;
    text-decoration: none;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .guiides-brand strong {
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .guiides-brand:hover { color: #B84835; }
  .intro-section .updated-inline {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--progress);
    margin-bottom: 0.6rem;
  }
  /* =================== SETTINGS GEAR =================== */
  .settings-wrap { position: relative; }
  .topbar-icons { display: flex; align-items: center; gap: 0.15rem; }
  .topbar-icon {
    background: none;
    border: none;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
    color: var(--text-3);
    position: relative;
  }
  .topbar-icon:hover { color: var(--text); }
  .topbar-icon svg { width: 15px; height: 15px; }
  .topbar-icon .copied-tip {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    font-size: 0.58rem;
    font-weight: 600;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .topbar-icon .copied-tip.show { opacity: 1; }
  .settings-btn { position: relative; }
  .settings-btn svg { width: 15px; height: 15px; }

  .settings-popover {
    position: fixed;
    top: 36px;
    right: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0;
    min-width: 210px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 0.15s, transform 0.15s;
  }
  .settings-popover.open {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0);
  }
  body.dark .settings-popover { box-shadow: 0 6px 24px rgba(0,0,0,0.5); }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.4rem 0.9rem;
    font-size: 0.73rem;
    color: var(--text-2);
    user-select: none;
  }
  .settings-label { font-weight: 500; }
  .settings-cycle {
    display: flex;
    align-items: center;
    gap: 0.15rem;
  }
  .settings-arrow {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    font-size: 0.85rem;
    padding: 0.1rem 0.3rem;
    line-height: 1;
    transition: color 0.12s;
    font-family: var(--sans);
  }
  .settings-arrow:hover { color: var(--text); }
  .settings-value {
    font-weight: 600;
    color: var(--text);
    min-width: 54px;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.02em;
  }

  /* =================== LAYOUT SWAP =================== */
  body.layout-swapped .layout { flex-direction: row-reverse; }
  @media (max-width: 768px) {
    body.layout-swapped .layout { flex-direction: column; }
  }

  /* =================== PIN FADE (All filter) =================== */
  body.filter-all .pin { filter: saturate(0.7) brightness(0.9); }
  body.filter-all .pin.active { filter: none; }

  /* =================== READER LIKES =================== */
  .reader-likes {
    display: inline;
    font-size: 0.82rem;
    color: var(--text-3);
  }
  .reader-likes .like-sep {
    color: var(--border);
    margin: 0 0.3rem;
  }
  .like-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--border);
    transition: color 0.2s, transform 0.2s;
    padding: 0;
    line-height: 1;
    vertical-align: baseline;
  }
  .like-btn:hover { color: #E25555; }
  .like-btn.liked { color: #E25555; }
  .like-btn.pop { animation: heartPop 0.3s ease-out; }

  /* =================== EDITORIAL INTRO =================== */
  .intro-section {
    padding: 2rem 2.5rem 1.5rem;
    text-align: center;
  }
  .intro-section h1 {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 0.6rem;
  }
  .intro-section .deck {
    font-family: var(--serif);
    font-size: 1.05rem;
    font-style: italic;
    color: var(--text-2);
    max-width: 460px;
    margin: 0 auto 1rem;
    line-height: 1.55;
  }
  .intro-section .byline {
    font-size: 0.82rem;
    color: var(--text-2);
  }
  .intro-section .byline strong {
    color: var(--text);
    font-weight: 600;
  }

  .intro-body {
    padding: 1.5rem 2.5rem 1rem;
    text-align: left;
  }
  .intro-body p {
    font-family: var(--serif);
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text-2);
    margin-bottom: 1rem;
  }
  .intro-body p:last-of-type { margin-bottom: 0; }
  .intro-body .drop-cap::first-letter {
    font-family: var(--serif);
    font-size: 3.8rem;
    font-weight: 700;
    float: left;
    line-height: 0.8;
    margin: 0.05em 0.12em 0 0;
    color: var(--progress);
  }

  /* Intro collapse/expand */
  .intro-body.collapsed {
    max-height: 16rem;
    overflow: hidden;
    position: relative;
  }
  .intro-body.collapsed::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 9rem;
    background: linear-gradient(
      rgba(var(--bg-rgb, 247,244,239), 0) 0%,
      rgba(var(--bg-rgb, 247,244,239), 0.5) 30%,
      rgba(var(--bg-rgb, 247,244,239), 0.85) 55%,
      rgba(var(--bg-rgb, 247,244,239), 1) 75%
    );
    pointer-events: none;
  }
  body.dark .intro-body.collapsed::after {
    background: linear-gradient(
      rgba(30, 30, 30, 0) 0%,
      rgba(30, 30, 30, 0.5) 30%,
      rgba(30, 30, 30, 0.85) 55%,
      rgba(30, 30, 30, 1) 75%
    );
  }
  .intro-toggle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    margin: 0 auto;
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--progress);
    cursor: pointer;
    padding: 0;
    transition: color 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .intro-toggle:hover { opacity: 0.7; }
  .intro-toggle svg {
    width: 22px;
    height: 12px;
    stroke: currentColor;
    transition: transform 0.3s;
  }
  .intro-body:not(.collapsed) + .intro-toggle-wrap .intro-toggle svg {
    transform: rotate(180deg);
  }
  .intro-toggle-wrap {
    text-align: center;
    padding: 0 2.5rem 1rem;
    margin-top: -4rem;
    position: relative;
    z-index: 2;
    border-bottom: 1px solid var(--border);
  }
  .intro-body:not(.collapsed) + .intro-toggle-wrap {
    margin-top: 0;
  }

  /* =================== FILTER BAR =================== */
  .filter-bar {
    position: sticky;
    top: 3px;
    z-index: 14;
    background: var(--bg);
    padding: 0.6rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.45rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text-2);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
  }
  .filter-btn:hover { border-color: var(--text-3); background: var(--hover); }
  .filter-btn.active { color: #fff; border-color: transparent; }

  /* Tag-style filter variant */
  body.tag-filters .filter-btn {
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.62rem;
    padding: 0.25rem 0.55rem;
    border: none;
    color: var(--text-2);
    background: var(--hover);
  }
  body.tag-filters .filter-btn:hover { background: var(--border); }
  body.tag-filters .filter-btn.active { color: #fff; }
  .filter-count {
    font-size: 0.72rem;
    color: var(--text-3);
    white-space: nowrap;
    margin-left: auto;
  }

  /* =================== ENTRY CARD =================== */
  .entry {
    padding: 1.75rem 2.5rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.2s;
  }
  .entry:hover { background: var(--hover); cursor: pointer; }
  .entry.active { background: var(--hover); }
  .entry.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--c-active, var(--progress));
    border-radius: 4px 0 0 4px;
  }
  .entry.hidden { display: none; }

  .entry-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.2rem;
  }
  .entry-tag {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.12rem 0.45rem;
    border-radius: 2px;
    color: #fff;
  }
  /* Category label: text only */
  body.tag-text .entry-tag {
    background: transparent !important;
    color: var(--tag-color);
    padding: 0;
  }
  /* Category label: pill */
  body.tag-pill .entry-tag {
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
  }
  .entry-price {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-3);
  }
  .entry-title-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .entry h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.25;
  }

  /* Share / copy link button */
  .entry .share-link {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    font-size: 0.75rem;
    opacity: 0.5;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
    padding: 0.1rem;
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .entry:hover .share-link { opacity: 0.7; }
  .entry.active .share-link { opacity: 0.7; }
  .share-link:hover { opacity: 1 !important; color: var(--progress); }
  .share-link svg { width: 14px; height: 14px; }
  .share-link .copied-tip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    font-size: 0.6rem;
    font-weight: 600;
    padding: 0.2rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .share-link .copied-tip.show { opacity: 1; }

  .entry .desc {
    font-family: var(--serif);
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--text-2);
    margin-bottom: 1rem;
  }

  /* Thumbnail */
  .entry-thumb-wrap {
    float: right;
    width: 140px;
    margin: 0.1rem 0 0.75rem 1.25rem;
  }
  .entry-thumb {
    width: 100%;
    aspect-ratio: 2/1;
    object-fit: cover;
    border-radius: 3px;
    display: block;
    background: var(--border);
  }
  .entry-thumb-placeholder {
    width: 100%;
    aspect-ratio: 2/1;
    border-radius: 3px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .entry-thumb-placeholder svg {
    width: 20px;
    height: 20px;
    color: var(--text-3);
    opacity: 0.35;
  }

  /* Entry link row */
  .entry-links {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  .entry-links a {
    font-size: 0.73rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--text-2);
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    transition: all 0.15s;
  }
  .entry-links a:hover {
    border-color: var(--text-2);
    background: var(--text);
    color: var(--bg);
  }
  .entry-links svg { width: 12px; height: 12px; }

  /* =================== HEART FAVORITES =================== */
  .entry-heart {
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--border);
    transition: color 0.2s, transform 0.2s;
    z-index: 3;
    padding: 0.2rem;
  }
  .entry-heart:hover { color: var(--text-3); }
  .entry-heart.hearted { color: #E25555; }
  .entry-heart.hearted:hover { color: #C94444; }
  @keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .entry-heart.pop { animation: heartPop 0.3s ease-out; }
  .card-heart {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    color: rgba(255,255,255,0.3);
    font-size: 1rem;
  }
  .card-heart:hover { color: rgba(255,255,255,0.5); }
  .card-heart.hearted { color: #E25555; }

  .saved-toast {
    position: fixed;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    font-family: var(--sans);
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 0.8rem 1.2rem;
    border-radius: 10px;
    max-width: 320px;
    text-align: center;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .saved-toast.show { opacity: 1; }

  .entry-heart.card-heart {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.3);
  }
  .entry-heart.card-heart.hearted { color: #E25555; }
  .card { position: relative; }

  /* =================== SECTION BREAKS =================== */
  .section-break {
    padding: 2rem 2.5rem 1.5rem;
    border-top: 2px solid var(--border);
    border-bottom: 2px solid var(--border);
    text-align: center;
    scroll-margin-top: 3.5rem;
  }
  .section-break h3 {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .section-break p {
    font-family: var(--serif);
    font-size: 0.92rem;
    font-style: italic;
    color: var(--text-2);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
  }

  /* =================== VIEW TRANSITION =================== */
  .view-fade {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease-out;
  }
  .view-fade.active {
    opacity: 1;
    pointer-events: all;
  }

  /* =================== LOCATE ME =================== */
  .locate-btn {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 1000;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: all 0.2s;
  }
  @media (max-width: 768px) {
    .locate-btn { top: 3.5rem; }
  }
  .locate-btn:hover { border-color: var(--text-3); }
  .locate-btn svg { width: 18px; height: 18px; stroke: var(--text-2); }
  .locate-btn.active svg { stroke: var(--progress); }
  .user-marker {
    width: 14px;
    height: 14px;
    background: #4285F4;
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(66,133,244,0.3), 0 2px 6px rgba(0,0,0,0.3);
  }

  /* =================== MAP PINS =================== */
  .pin-wrap { position: relative; }
  .pin {
    width: var(--pin-size);
    height: var(--pin-size);
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: box-shadow 0.25s, filter 0.3s;
  }
  @media (min-width: 769px) {
    .pin { transition: transform 0.25s, box-shadow 0.25s, filter 0.3s; }
    cursor: pointer;
  }
  .pin.active {
    transform: scale(1.6);
    box-shadow: 0 3px 14px rgba(0,0,0,0.35);
    z-index: 1000 !important;
  }
  /* Marker shape: diamond variant */
  body.diamond-pins .pin {
    border-radius: 2px;
    transform: rotate(45deg);
  }
  body.diamond-pins .pin.active {
    transform: rotate(45deg) scale(1.5);
  }
  /* Marker shape: square variant */
  body.square-pins .pin {
    border-radius: 2px;
  }
  body.square-pins .pin.active {
    transform: scale(1.5);
  }

  .pin-label {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 28, 30, 0.88);
    color: #fff;
    font-family: var(--sans);
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    white-space: nowrap;
    box-shadow: 0 1px 6px rgba(0,0,0,0.2);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .pin.active + .pin-label { opacity: 1; }

  /* =================== MOBILE =================== */
  .mobile-toggle {
    display: flex;
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 9999;
    background: var(--text);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  @media (max-width: 768px) {
    .mobile-toggle {
      right: auto;
      left: 50%;
      transform: translateX(-50%);
    }
  }
  .mobile-toggle button {
    font-family: var(--sans);
    font-size: 0.73rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    padding: 0.65rem 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    color: #aaa;
    background: transparent;
    transition: all 0.2s;
  }
  .mobile-toggle button.active {
    color: #fff;
    background: var(--progress);
    border-radius: 999px;
  }
  .mobile-toggle button svg { width: 14px; height: 14px; }

  /* Card carousel */
  .card-carousel {
    display: none;
    position: fixed;
    bottom: 3.5rem;
    left: 0; right: 0;
    z-index: 40;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 0 1rem 0.5rem;
    gap: 0.75rem;
    scrollbar-width: none;
  }
  .card-carousel::-webkit-scrollbar { display: none; }

  .card {
    scroll-snap-align: center;
    flex: 0 0 82vw;
    max-width: 420px;
    background: rgba(28, 28, 30, var(--card-alpha));
    -webkit-backdrop-filter: blur(var(--card-blur)) saturate(1.4);
    backdrop-filter: blur(var(--card-blur)) saturate(1.4);
    color: #fff;
    border-radius: 14px;
    padding: 1rem 1.1rem;
    min-height: 110px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .card.hidden { display: none; }
  .card-body { }
  .card-thumb-float {
    float: right;
    width: 68px;
    height: 68px;
    border-radius: 6px;
    object-fit: cover;
    margin: 0 0 0.5rem 0.75rem;
    background: #444;
  }
  .card-body h3 {
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-body .card-cat {
    font-size: 0.63rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #d4d4d4;
    margin-bottom: 0.35rem;
  }
  .card-body .card-desc {
    font-size: 0.78rem;
    line-height: 1.5;
    color: #e2e2e2;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: all 0.2s;
  }
  .card.expanded .card-desc {
    display: block;
    -webkit-line-clamp: unset;
    overflow-y: auto;
    max-height: 35vh;
    -webkit-overflow-scrolling: touch;
  }
  .card-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 0.3rem;
    flex-wrap: nowrap;
  }
  .card-expand-btn {
    background: none;
    border: none;
    color: #F0A08A;
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-action-links {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    flex-shrink: 0;
  }
  .card-action-links a {
    font-size: 0.68rem;
    font-weight: 600;
    color: #F0A08A;
    text-decoration: none;
    white-space: nowrap;
  }
  /* Card theme: Turquoise */
  body.card-turquoise .card {
    background: rgba(0, 55, 60, var(--card-alpha));
    border-color: rgba(100, 220, 220, 0.12);
  }
  body.card-turquoise .card-expand-btn,
  body.card-turquoise .card-action-links a { color: #7FD8D0; }
  body.card-turquoise .card-body .card-cat { color: #9CE0D8; }
  body.card-turquoise .pin-label {
    background: rgba(0, 55, 60, 0.92);
    color: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }

  /* Card theme: Plum */
  body.card-plum .card {
    background: rgba(50, 18, 48, var(--card-alpha));
    border-color: rgba(200, 130, 190, 0.12);
  }
  body.card-plum .card-expand-btn,
  body.card-plum .card-action-links a { color: #D4A0CC; }
  body.card-plum .card-body .card-cat { color: #DDB8D7; }
  body.card-plum .pin-label {
    background: rgba(50, 18, 48, 0.92);

    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }

  /* Card theme: Light */
  body.card-light .card {
    background: rgba(255, 255, 255, var(--card-alpha));
    border-color: rgba(0, 0, 0, 0.08);
    color: var(--text);

  body.card-light .card h3 { color: #1A1A1A; }
  body.card-light .card-body .card-desc { color: #444; }
  body.card-light .card-body .card-cat { color: #777; }
  body.card-light .card-expand-btn,
  body.card-light .card-action-links a { color: var(--progress); }
  body.card-light .pin-label {
    background: rgba(255, 255, 255, 0.95);

  }

  /* =================== MAP FILTER BAR (all viewports) =================== */
  .map-filter-bar {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 45;
    background: var(--bg);
    padding: 0.6rem 1.25rem;

    gap: 0.4rem;
    overflow-x: auto;
    scrollbar-width: none;
    align-items: center;
  }
  .map-filter-bar::-webkit-scrollbar { display: none; }

  /* =================== DESKTOP MAP VIEW =================== */
  body.view-map .col-left { display: none; }
  body.view-map .col-right { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: 5; }
  body.view-map .card-carousel { display: flex; }
  body.view-map { overflow: hidden; height: 100vh; }
  body.view-map .map-filter-bar { display: flex; }
  body.view-map .leaflet-top { top: 45px !important; }
  body.view-map .locate-btn { top: 3.5rem; }

  body.view-list .card-carousel { display: none; }
  body.view-list .map-filter-bar { display: none; }

  /* =================== MOBILE RESPONSIVE =================== */
  @media (max-width: 768px) {
    body { overflow: auto; height: auto; }
    .layout { flex-direction: column; height: auto; }
    .col-right {
      width: 100%; height: 100vh;
      position: fixed; top: 0; left: 0; z-index: 5;
    }

      width: 100%; height: auto;
      overflow-y: visible; position: relative;

    }
    .mobile-toggle { } /* inherits display:flex from base */
    .progress-bar { display: none; }
    .top-bar { padding: 0.4rem 1.25rem; }
    .intro-section { padding: 1.5rem 1.5rem 1rem; }

    .filter-btn { font-size: 0.65rem; padding: 0.3rem 0.7rem; }

    .map-filter-bar { padding: 0.55rem 1rem; gap: 0.35rem; }

    body.view-list .col-right { display: none; }
    body.view-list .col-left { display: block; }
    body.view-list .card-carousel { display: none; }
    body.view-list .map-filter-bar { display: none; }
  }

  /* =================== SETTINGS SLIDERS =================== */
  .settings-slider-wrap {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .settings-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 72px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .settings-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--progress);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .settings-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--progress);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .settings-divider {
    height: 1px;
    background: var(--border);
    margin: 0.25rem 0.9rem;
  }

  /* =================== DESIGN TESTING CLASSES =================== */
  /* Text size */
  body.text-compact .entry .desc { font-size: 0.85rem; line-height: 1.6; }
  body.text-compact .entry h2 { font-size: 1.15rem; }
  body.text-compact .intro-body p { font-size: 0.9rem; line-height: 1.65; }

  body.text-large .entry .desc { font-size: 1.08rem; line-height: 1.85; }
  body.text-large .entry h2 { font-size: 1.45rem; }
  body.text-large .intro-body p { font-size: 1.1rem; line-height: 1.9; }
  body.text-large .card-body .card-desc { font-size: 0.85rem; }

  /* Hide thumbnails */
  body.hide-thumbs .entry-thumb-wrap { display: none; }
</style>
</head>

<script>
// ============================================
// SETTINGS SYSTEM
// ============================================
const cardThemes = ['', 'card-turquoise', 'card-plum', 'card-light'];
const cardLabels = ['Dark Glass', 'Turquoise', 'Plum', 'Light'];
let cardThemeIdx = 0;

const settingsConfig = [
  {
    key: 'theme', label: 'Theme', type: 'cycle', options: ['Light', 'Dark'],
    get: () => document.body.classList.contains('dark') ? 1 : 0,
    set: (idx) => {
      document.body.classList.toggle('dark', idx === 1);
      if (window._swapTiles) window._swapTiles(idx === 1);
      try { localStorage.setItem('vg-dark', idx === 1 ? '1' : '0'); } catch(e) {}
    }
  },
  {
    key: 'layout', label: 'Map Position', type: 'cycle', options: ['Map Right', 'Map Left'],
    get: () => document.body.classList.contains('layout-swapped') ? 1 : 0,
    set: (idx) => {
      document.body.classList.toggle('layout-swapped', idx === 1);
      try { localStorage.setItem('vg-layout', idx === 1 ? '1' : '0'); } catch(e) {}
      setTimeout(() => { if (window._map) window._map.invalidateSize(); }, 200);
    }
  },
  {
    key: 'accent', label: 'Accent', type: 'cycle',
    options: ['Teal', 'Coral', 'Gold', 'Indigo', 'Rose', 'Slate'],
    _colors: ['#2AAA8A', '#D95B43', '#C4A035', '#4A6FA5', '#C96B8B', '#6B8291'],
    get: function() {
      const cur = getComputedStyle(document.documentElement).getPropertyValue('--progress').trim();
      const idx = this._colors.indexOf(cur);
      return idx >= 0 ? idx : 0;
    },
    set: function(idx) {
      document.documentElement.style.setProperty('--progress', this._colors[idx]);
      try { localStorage.setItem('vg-accent', idx); } catch(e) {}
    }
  },
  { key: '_d0', type: 'divider' },
  {
    key: 'pinshape', label: 'Pin Shape', type: 'cycle', options: ['Circle', 'Diamond', 'Square'],
    get: () => document.body.classList.contains('diamond-pins') ? 1 : document.body.classList.contains('square-pins') ? 2 : 0,
    set: (idx) => {
      document.body.classList.remove('diamond-pins', 'square-pins');
      if (idx === 1) document.body.classList.add('diamond-pins');
      if (idx === 2) document.body.classList.add('square-pins');
      try { localStorage.setItem('vg-pin-shape', idx); } catch(e) {}
    }
  },
  {
    key: 'pinsize', label: 'Pin Size', type: 'slider', min: 8, max: 28, step: 2, unit: 'px',
    get: () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pin-size')) || 16,
    set: (val) => {
      document.documentElement.style.setProperty('--pin-size', val + 'px');
      try { localStorage.setItem('vg-pinsize', val); } catch(e) {}
    }
  },
  { key: '_d1', type: 'divider' },
  {
    key: 'cards', label: 'Cards', type: 'cycle', options: cardLabels,
    get: () => cardThemeIdx,
    set: (idx) => {
      if (cardThemes[cardThemeIdx]) document.body.classList.remove(cardThemes[cardThemeIdx]);
      cardThemeIdx = idx;
      if (cardThemes[cardThemeIdx]) document.body.classList.add(cardThemes[cardThemeIdx]);
      try { localStorage.setItem('vg-card-theme', cardThemeIdx); } catch(e) {}
    }
  },
  {
    key: 'blur', label: 'Card Blur', type: 'slider', min: 0, max: 30, step: 1, unit: 'px',
    get: () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-blur')) || 0,
    set: (val) => {
      document.documentElement.style.setProperty('--card-blur', val + 'px');
      try { localStorage.setItem('vg-blur', val); } catch(e) {}
    }
  },
  {
    key: 'opacity', label: 'Card Opacity', type: 'slider', min: 10, max: 100, step: 5, unit: '%',
    get: () => Math.round((parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-alpha')) || 0.85) * 100),
    set: (val) => {
      document.documentElement.style.setProperty('--card-alpha', val / 100);
      try { localStorage.setItem('vg-opacity', val); } catch(e) {}
    }
  },
  { key: '_d2', type: 'divider' },
  {
    key: 'filters', label: 'Filters', type: 'cycle', options: ['Pills', 'Tags'],
    get: () => document.body.classList.contains('tag-filters') ? 1 : 0,
    set: (idx) => {
      document.body.classList.toggle('tag-filters', idx === 1);
      try { localStorage.setItem('vg-tags', idx === 1 ? '1' : '0'); } catch(e) {}
    }
  },
  {
    key: 'textsize', label: 'Text Size', type: 'cycle', options: ['Normal', 'Compact', 'Large'],
    get: () => document.body.classList.contains('text-compact') ? 1 : document.body.classList.contains('text-large') ? 2 : 0,
    set: (idx) => {
      document.body.classList.remove('text-compact', 'text-large');
      if (idx === 1) document.body.classList.add('text-compact');
      if (idx === 2) document.body.classList.add('text-large');
      try { localStorage.setItem('vg-textsize', idx); } catch(e) {}
    }
  },
  {
    key: 'catlabel', label: 'Category Labels', type: 'cycle', options: ['Box', 'Text', 'Pill'],
    get: () => document.body.classList.contains('tag-text') ? 1 : document.body.classList.contains('tag-pill') ? 2 : 0,
    set: (idx) => {
      document.body.classList.remove('tag-text', 'tag-pill');
      if (idx === 1) document.body.classList.add('tag-text');
      if (idx === 2) document.body.classList.add('tag-pill');
      try { localStorage.setItem('vg-catlabel', idx); } catch(e) {}
    }
  },
  {
    key: 'thumbs', label: 'Thumbnails', type: 'cycle', options: ['Show', 'Hide'],
    get: () => document.body.classList.contains('hide-thumbs') ? 1 : 0,
    set: (idx) => {
      document.body.classList.toggle('hide-thumbs', idx === 1);
      try { localStorage.setItem('vg-thumbs', idx === 1 ? '1' : '0'); } catch(e) {}
    }
  }
];

function cycleSetting(key, dir) {
  const cfg = settingsConfig.find(s => s.key === key);
  if (!cfg) return;
  let cur = cfg.get();
  cur = (cur + dir + cfg.options.length) % cfg.options.length;
  cfg.set(cur);
  const val = document.getElementById('sv-' + key);
  if (val) val.textContent = cfg.options[cur];
}

// Build settings popover
(function buildSettings() {
  const pop = document.getElementById('settingsPopover');
  settingsConfig.forEach(cfg => {
    if (cfg.type === 'divider') {
      const d = document.createElement('div');
      d.className = 'settings-divider';
      pop.appendChild(d);
      return;
    }
    const row = document.createElement('div');
    row.className = 'settings-row';
    if (cfg.type === 'slider') {
      const curVal = cfg.get();
      row.innerHTML =
        '<span class="settings-label">' + cfg.label + '</span>' +
        '<div class="settings-slider-wrap">' +
        '<input type="range" class="settings-slider" id="ss-' + cfg.key + '" ' +
        'min="' + cfg.min + '" max="' + cfg.max + '" step="' + cfg.step + '" value="' + curVal + '">' +
        '<span class="settings-value" id="sv-' + cfg.key + '">' + curVal + cfg.unit + '</span>' +

        '</div>';
      pop.appendChild(row);
    }
  });
  pop.addEventListener('click', e => {
    const arrow = e.target.closest('.settings-arrow');
    if (arrow) { e.stopPropagation(); cycleSetting(arrow.dataset.key, parseInt(arrow.dataset.dir)); }
  });
  document.getElementById('settingsBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    settingsConfig.forEach(cfg => {
      if (cfg.type === 'divider') return;
      const val = document.getElementById('sv-' + cfg.key);
      if (!val) return;
      if (cfg.type === 'slider') {
        const cv = cfg.get();
        val.textContent = cv + cfg.unit;
        const sl = document.getElementById('ss-' + cfg.key);
        if (sl) sl.value = cv;
      } else {

      }
    });

  });
  document.addEventListener('click', (e) => {
    if (!pop.contains(e.target)) pop.classList.remove('open');

// ============================================
// MARKDOWN PARSER
// ============================================
function parsePlacesMd(text) {
  const [configBlock, ...entryBlocks] = text.split(/^===$/m);
  const guide = {};
  const categories = {};
  let introLines = [];
  let section = 'meta';

  configBlock.split('\n').forEach(line => {
    if (line.trim() === '## Intro') { section = 'intro'; return; }
    if (line.trim() === '## Categories') { section = 'categories'; return; }

    if (section === 'meta') {
      const m = line.match(/^(\w[\w\s]*?):\s*(.+)$/);
      if (m) {
        const key = m[1].trim(), val = m[2].trim();
        if (key === 'Guide') guide.eyebrow = val;
        else if (key === 'Title') guide.title = val;
        else if (key === 'Subtitle') guide.deck = val;
        else if (key === 'Author') guide.byline = val;
        else if (key === 'Updated') guide.updated = val;
        else if (key === 'More Guides') {
          guide.moreGuides = [];
          const lr = /\[([^\]]+)\]\(([^)]+)\)/g;
          let lm;
          while ((lm = lr.exec(val)) !== null) {
            guide.moreGuides.push({ name: lm[1], url: lm[2] });
          }
        }
      }
    } else if (section === 'intro') {
      introLines.push(line);
    } else if (section === 'categories') {
      const cm = line.match(/^(.+?):\s*(#[0-9a-fA-F]{3,8})$/);
      if (cm) categories[cm[1].trim()] = { color: cm[2].trim() };
    }
  });

  guide.intro = introLines.join('\n').split(/\n\n+/).map(p => p.trim()).filter(Boolean);

  const entriesRaw = entryBlocks.join('===').split(/^---$/m).filter(b => b.trim());
  const places = [];
  const sectionBreaks = []; // { beforeIndex, title, content }

  entriesRaw.forEach(block => {
    const lines = block.split('\n');
    // Detect section break: ## Title (double hash)
    const sectionLine = lines.find(l => l.trim().match(/^## (.+)$/));
    if (sectionLine) {
      const title = sectionLine.trim().replace(/^##\s*/, '');
      const contentLines = [];
      let pastTitle = false;
      lines.forEach(l => {
        if (l.trim() === sectionLine.trim()) { pastTitle = true; return; }
        if (pastTitle && l.trim()) contentLines.push(l.trim());
      });
      sectionBreaks.push({
        beforeIndex: places.length,
        title: title,
        content: contentLines.join(' ')
      });
      return;
    }

    const place = { gmaps: null, instagram: null, facebook: null, image: null, price: null };
    const descLines = [];
    let foundName = false;

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) { if (foundName) descLines.push(''); return; }

      if (!foundName && trimmed.startsWith('# ')) {
        place.name = trimmed.replace(/^#+\s*/, '');
        place.slug = place.name.toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        foundName = true;
        return;
      }

      const meta = trimmed.match(/^-\s*(.+?):\s*(.+)$/);
      if (meta && descLines.filter(l => l.trim()).length === 0) {
        const key = meta[1].trim().toLowerCase(), val = meta[2].trim();
        if (key === 'category') place.category = val;
        else if (key === 'price') place.price = val;
        else if (key === 'location') {
          const c = val.split(',').map(x => parseFloat(x.trim()));
          place.lat = c[0]; place.lng = c[1];
        }
        else if (key === 'image') place.image = val;
        else if (key === 'google maps') place.gmaps = val;
        else if (key === 'instagram') place.instagram = val;
        else if (key === 'facebook') place.facebook = val;
        return;
      }

      descLines.push(trimmed);
    });

    place.description = descLines.join('\n').split(/\n\n+/)
      .map(p => p.trim()).filter(Boolean).join(' ');
    if (place.name && place.lat) places.push(place);
  });

  return { guide, categories, places, sectionBreaks };
}

  // Sync all heart buttons for this slug
  document.querySelectorAll('.entry-heart[data-slug="' + slug + '"]').forEach(h => {
    h.classList.toggle('hearted', savedSlugs.has(slug));

  // Sync saved filter button visibility across both filter bars

    b.style.display = savedSlugs.size > 0 ? '' : 'none';

  if (activeFilter === '__saved' && savedSlugs.size === 0) {
    const allBtn = document.querySelector('.filter-btn[data-filter="all"]');

    if (e.target.tagName === 'A') return;
    if (e.target.classList.contains('card-expand-btn')) {
      card.classList.toggle('expanded');
      e.target.textContent = card.classList.contains('expanded') ? 'Less ▴' : 'Read more ▾';
      return;
    }
    setActive(i, 'card');
  });
  carousel.appendChild(card);
});

// ============================================
// MAP
// ============================================
const map = L.map('map', { zoomControl: true, scrollWheelZoom: true })
  .setView([20.9160, -100.7440], 15);
window._map = map;

const tileUrls = {
  light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2thp_1_6ffbb574555fa573f30768f0',
  dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2thp_1_6ffbb574555fa573f30768f0'
};
const tileAttr = '&copy; <a href="https://openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>';

// Defer tile loading on mobile — no tile HTTP requests until user opens map view
let tileLayer = null;
let tilesLoaded = false;
function ensureTiles() {
  if (tilesLoaded) return;
  tilesLoaded = true;
  tileLayer = L.tileLayer(
    document.body.classList.contains('dark') ? tileUrls.dark : tileUrls.light,
    { attribution: tileAttr, maxZoom: 19 }
  ).addTo(map);
}
if (window.innerWidth > 768) ensureTiles(); // Desktop: load immediately (split pane visible)

window._swapTiles = function(isDark) {
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(isDark ? tileUrls.dark : tileUrls.light, { attribution: tileAttr, maxZoom: 19 }).addTo(map);
  tilesLoaded = true;
};

const markerLayer = L.layerGroup().addTo(map);
const markerRefs = [];

places.forEach((p, i) => {
  const col = catColor(p.category);
  const icon = L.divIcon({
    className: '',
    html: '<div class="pin-wrap">' +
      '<div class="pin" id="pin-' + i + '" style="background:' + col + '" data-index="' + i + '"></div>' +
      '<div class="pin-label">' + p.name + '</div>' +
      '</div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  const marker = L.marker([p.lat, p.lng], { icon }).addTo(markerLayer);
  marker.on('click', () => setActive(i, 'map'));
  markerRefs.push(marker);
});

// ============================================
// SYNC LOGIC
// ============================================
let activeIndex = -1;
let lockSource = null;
let lockTimer = null;

function acquireLock(src, ms) {
  lockSource = src;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { lockSource = null; }, ms);
}

function setActive(index, source) {
  if (index < 0 || index >= places.length) return;
  if (index === activeIndex && source === 'scroll') return;
  activeIndex = index;

  // Highlight entries
  document.querySelectorAll('.entry').forEach((el, i) => {
    el.classList.toggle('active', i === index);
    if (i === index) el.style.setProperty('--c-active', catColor(places[i].category));
  });

  // Highlight pins (by ID, not DOM position — Leaflet reorders DOM on filter)
  document.querySelectorAll('.pin.active').forEach(el => el.classList.remove('active'));
  const targetPin = document.getElementById('pin-' + index);
  if (targetPin) targetPin.classList.add('active');

  // Fly map — on mobile map view, offset southward so pin sits above card carousel
  const isMobileMap = window.innerWidth <= 768 && document.body.classList.contains('view-map');
  if (isMobileMap) {
    const targetZoom = map.getZoom() < 14 ? 16 : map.getZoom();
    const targetPoint = map.project([places[index].lat, places[index].lng], targetZoom);
    targetPoint.y += window.innerHeight * 0.18; // push center south so pin rises
    const offsetLatLng = map.unproject(targetPoint, targetZoom);
    map.flyTo(offsetLatLng, targetZoom, { duration: 0.7 });
  } else {
    map.flyTo([places[index].lat, places[index].lng], 16, { duration: 0.7 });
  }

  // Scroll list on marker click
  if (source === 'map') {
    acquireLock('map', 1200);
    const el = document.getElementById('entry-' + places[index].slug);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Scroll carousel
  if (source === 'map' || source === 'list') {
    const card = document.getElementById('card-' + index);
    if (card) {
      acquireLock('carousel', 800);
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  // Hash is NOT set in the URL — only used when copying share links
}

// ============================================
// SCROLL OBSERVER
// ============================================
const colLeft = document.getElementById('colLeft');
const progressFill = document.getElementById('progressFill');

const observer = new IntersectionObserver(entries => {
  if (lockSource === 'map' || lockSource === 'carousel' || lockSource === 'view-switch') return;
  let best = null;
  entries.forEach(e => {
    if (e.isIntersecting && e.intersectionRatio >= 0.45) {
      if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
    }
  });
  if (best) {
    const idx = parseInt(best.target.dataset.index);
    if (!isNaN(idx) && idx !== activeIndex) setActive(idx, 'scroll');
  }
}, { root: colLeft, threshold: [0.45, 0.6, 0.8] });

document.querySelectorAll('.entry').forEach(el => observer.observe(el));

// Progress bar
colLeft.addEventListener('scroll', () => {
  const t = colLeft.scrollTop;
  const h = colLeft.scrollHeight - colLeft.clientHeight;
  progressFill.style.width = (h > 0 ? (t / h) * 100 : 0) + '%';
});

// Carousel swipe detection
let carouselTimer;
carousel.addEventListener('scroll', () => {
  if (lockSource === 'carousel') return;
  clearTimeout(carouselTimer);
  carouselTimer = setTimeout(() => {
    // Collapse any expanded cards when swiping
    carousel.querySelectorAll('.card.expanded').forEach(c => {
      c.classList.remove('expanded');
      const btn = c.querySelector('.card-expand-btn');
      if (btn) btn.textContent = 'Read more ▾';
    });
    const cx = carousel.scrollLeft + carousel.clientWidth / 2;
    let closest = 0, dist = Infinity;
    carousel.querySelectorAll('.card:not(.hidden)').forEach(card => {
      const d = Math.abs((card.offsetLeft + card.offsetWidth / 2) - cx);
      if (d < dist) { dist = d; closest = parseInt(card.dataset.index); }
    });
    if (closest !== activeIndex) setActive(closest, 'carousel-swipe');
  }, 100);
});

// ============================================
// FILTER
// ============================================
const filterCount = document.getElementById('filterCount');

function updateFilter() {
  document.body.classList.toggle('filter-all', activeFilter === 'all');
  let visible = 0;

  places.forEach((p, i) => {
    let show;
    if (activeFilter === 'all') show = true;
    else if (activeFilter === '__saved') show = savedSlugs.has(p.slug);
    else show = p.category === activeFilter;

    // List entries
    document.getElementById('entry-' + p.slug).classList.toggle('hidden', !show);

    // Mobile cards
    document.getElementById('card-' + i).classList.toggle('hidden', !show);

    // Fully hide/show map markers (not just faded)
    if (show) {
      if (!map.hasLayer(markerRefs[i])) markerRefs[i].addTo(markerLayer);
    } else {
      markerLayer.removeLayer(markerRefs[i]);
    }

    if (show) visible++;
  });

  filterCount.textContent = visible + ' spot' + (visible !== 1 ? 's' : '');

  // Filter section breaks to only show the matching category's blurb
  document.querySelectorAll('.section-break').forEach(sb => {
    const show = activeFilter === 'all' || sb.dataset.cat === activeFilter;
    sb.style.display = show ? '' : 'none';
  });

  // Re-observe only visible entries
  observer.disconnect();
  document.querySelectorAll('.entry:not(.hidden)').forEach(el => observer.observe(el));

  // Scroll behavior — skip on initial load (page starts at top)
  if (!filterInitialized) return;

  const visibleEntries = document.querySelectorAll('.entry:not(.hidden)');

  if (activeFilter !== 'all') {
    const sb = document.querySelector('.section-break[data-cat="' + activeFilter + '"]');
    if (sb) setTimeout(() => sb.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }

  if (visibleEntries.length) {
    const midEl = visibleEntries[Math.floor(visibleEntries.length / 2)];
    const midIdx = parseInt(midEl.dataset.index);
    activeIndex = midIdx;

    document.querySelectorAll('.entry.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.pin.active').forEach(el => el.classList.remove('active'));
    midEl.classList.add('active');
    midEl.style.setProperty('--c-active', catColor(places[midIdx].category));
    const pin = document.getElementById('pin-' + midIdx);
    if (pin) pin.classList.add('active');

    if (activeFilter === 'all') {
      setTimeout(() => midEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    }
  }

  // Fit map to visible markers
  const vc = places
    .filter(p => activeFilter === 'all' || p.category === activeFilter)
    .map(p => [p.lat, p.lng]);
  if (vc.length) {
    map.fitBounds(vc, { padding: [40, 40], maxZoom: 16, duration: 0.6 });
  }
}

let filterInitialized = false;
updateFilter();
filterInitialized = true;

// ============================================
// MOBILE VIEW TOGGLE
// ============================================
window.setView = function(mode) {
  const fade = document.getElementById('viewFade');
  const currentMode = document.body.classList.contains('view-map') ? 'map' : 'list';
  if (currentMode === mode) return;

  // Fade in
  fade.classList.add('active');

  setTimeout(() => {
    // Swap view behind the overlay
    const persist = [];
    if (document.body.classList.contains('dark')) persist.push('dark');
    if (document.body.classList.contains('tag-filters')) persist.push('tag-filters');
    if (document.body.classList.contains('diamond-pins')) persist.push('diamond-pins');
    if (document.body.classList.contains('square-pins')) persist.push('square-pins');
    if (document.body.classList.contains('layout-swapped')) persist.push('layout-swapped');
    if (document.body.classList.contains('filter-all')) persist.push('filter-all');
    if (document.body.classList.contains('text-compact')) persist.push('text-compact');
    if (document.body.classList.contains('text-large')) persist.push('text-large');
    if (document.body.classList.contains('hide-thumbs')) persist.push('hide-thumbs');
    if (document.body.classList.contains('tag-text')) persist.push('tag-text');
    if (document.body.classList.contains('tag-pill')) persist.push('tag-pill');
    cardThemes.forEach(t => { if (t && document.body.classList.contains(t)) persist.push(t); });
    document.body.className = persist.join(' ') + ' view-' + mode;

    document.getElementById('btnList').classList.toggle('active', mode === 'list');
    document.getElementById('btnMap').classList.toggle('active', mode === 'map');

    if (mode === 'map') {
      ensureTiles();
      // Force synchronous reflow so map container has correct dimensions
      // before Leaflet calculates tile positions and pin coordinates
      void document.querySelector('.col-right').offsetHeight;
      map.invalidateSize();
      if (activeIndex >= 0) {
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
          const targetZoom = 16;
          const targetPoint = map.project([places[activeIndex].lat, places[activeIndex].lng], targetZoom);
          targetPoint.y += window.innerHeight * 0.18;
          const offsetLatLng = map.unproject(targetPoint, targetZoom);
          map.setView(offsetLatLng, targetZoom, { animate: false });
        } else {
          map.setView([places[activeIndex].lat, places[activeIndex].lng], 16, { animate: false });
        }
        const card = document.getElementById('card-' + activeIndex);
        if (card) card.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
        // Highlight active pin + label
        document.querySelectorAll('.pin.active').forEach(el => el.classList.remove('active'));
        const pin = document.getElementById('pin-' + activeIndex);
        if (pin) pin.classList.add('active');
      }
      // Hold overlay to let tiles load into the correct viewport
      setTimeout(() => { fade.classList.remove('active'); }, 180);
      return;
    }

    if (mode === 'list' && activeIndex >= 0) {
      const savedIdx = activeIndex;
      acquireLock('view-switch', 600);
      activeIndex = savedIdx;
      const el = document.getElementById('entry-' + places[savedIdx].slug);
      if (el) {
        el.scrollIntoView({ behavior: 'auto', block: 'center' });
        document.querySelectorAll('.entry.active').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        el.style.setProperty('--c-active', catColor(places[savedIdx].category));
      }
      // Re-center desktop split-pane map on active pin
      setTimeout(() => {
        map.invalidateSize();
        map.setView([places[savedIdx].lat, places[savedIdx].lng], 16, { animate: false });
      }, 200);
    }

    // Fade out
    requestAnimationFrame(() => {
      fade.classList.remove('active');
    });
  }, 150);
};

// ============================================
// DEEP LINKS
// ============================================
function handleHash() {
  const h = location.hash.slice(1);
  if (h) {
    const idx = places.findIndex(p => p.slug === h);
    if (idx >= 0) {
      setTimeout(() => setActive(idx, 'map'), 400);
      return;
    }
  }
  // No hash — start at top, let user scroll naturally
  window.scrollTo(0, 0);
  const colLeft = document.getElementById('colLeft');
  if (colLeft) colLeft.scrollTop = 0;
}

handleHash();
window.addEventListener('hashchange', handleHash);

// ============================================
// LOCATE USER
// ============================================
let userMarker = null;

window.locateUser = function() {
  const btn = document.getElementById('locateBtn');
  if (!navigator.geolocation) {
    btn.title = 'Location not supported';
    return;
  }

  btn.classList.add('active');
  btn.title = 'Finding you…';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if (userMarker) {
        userMarker.setLatLng([lat, lng]);
      } else {
        const icon = L.divIcon({
          className: '',
          html: '<div class="user-marker"></div>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });
        userMarker = L.marker([lat, lng], { icon: icon, zIndexOffset: 9999 }).addTo(map);
      }

      map.flyTo([lat, lng], 16, { duration: 0.8 });
      btn.title = 'Find me on the map';
    },
    function(err) {
      btn.classList.remove('active');
      if (err.code === 1) {
        btn.title = 'Location access denied';
      } else {
        btn.title = 'Could not get location';
      }
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
};

} // end init()
</script>
</body>
</html>
