<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Miguel de Allende — City Vibe Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root {
    --bg: #FAF9F6;
    --text: #1A1A1A;
    --text-2: #5C5C5C;
    --text-3: #8A8A8A;
    --border: #E0DDD8;
    --hover: #F3F1ED;
    --progress: #D95B43;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

    /* category colors */
    --c-cheap:    #E07A3A;
    --c-sitdown:  #D95B43;
    --c-drinks:   #8B5DAD;
    --c-landmark: #3D6B5E;
    --c-default:  #D95B43;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; overflow: hidden; height: 100vh; }

  /* =================== TWO-COLUMN LAYOUT =================== */
  .layout {
    display: flex;
    height: 100vh;
  }
  .col-left {
    width: 50%;
    overflow-y: auto;
    position: relative;
  }
  .col-left::-webkit-scrollbar { width: 4px; }
  .col-left::-webkit-scrollbar-track { background: transparent; }
  .col-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .col-right {
    width: 50%;
    position: relative;
  }
  #map { width: 100%; height: 100%; }

  /* =================== PROGRESS BAR =================== */
  .progress-bar {
    position: sticky; top: 0; z-index: 15;
    height: 3px; background: var(--border);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--progress);
    transition: width 0.12s ease-out;
  }

  /* =================== EDITORIAL INTRO =================== */
  .intro-section {
    padding: 3rem 2.5rem 1.5rem;
    text-align: center;
  }
  .intro-section .eyebrow {
    font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--progress); margin-bottom: 0.75rem;
  }
  .intro-section h1 {
    font-family: var(--serif);
    font-size: 2rem; font-weight: 700;
    line-height: 1.15; margin-bottom: 0.6rem;
  }
  .intro-section .deck {
    font-family: var(--serif);
    font-size: 1.05rem; font-style: italic;
    color: var(--text-2); max-width: 460px;
    margin: 0 auto 1rem; line-height: 1.55;
  }
  .intro-section .byline {
    font-size: 0.82rem; color: var(--text-2);
  }
  .intro-section .byline strong { color: var(--text); font-weight: 600; }
  .intro-section .more-guides {
    margin-top: 0.5rem;
    font-size: 0.78rem; color: var(--text-3);
  }
  .intro-section .more-guides a {
    color: var(--text-2); font-weight: 600;
    text-decoration: none;
  }
  .intro-section .more-guides a:hover { text-decoration: underline; }

  .intro-body {
    padding: 1.5rem 2.5rem 2rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .intro-body p {
    font-family: var(--serif);
    font-size: 1rem; line-height: 1.8;
    color: var(--text-2);
    margin-bottom: 1rem;
  }
  .intro-body p:last-child { margin-bottom: 0; }
  .intro-body .drop-cap::first-letter {
    font-family: var(--serif);
    font-size: 3.8rem; font-weight: 700;
    float: left; line-height: 0.8;
    margin: 0.05em 0.12em 0 0;
    color: var(--progress);
  }

  /* =================== FILTER BAR =================== */
  .filter-bar {
    position: sticky; top: 3px; z-index: 14;
    background: var(--bg);
    padding: 0.6rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.45rem;
    overflow-x: auto; scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    font-family: var(--sans);
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text-2); background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px; padding: 0.35rem 0.85rem;
    cursor: pointer; white-space: nowrap;
    transition: all 0.18s;
  }
  .filter-btn:hover { border-color: var(--text-3); background: var(--hover); }
  .filter-btn.active {
    color: #fff; border-color: transparent;
  }
  .filter-count {
    font-size: 0.72rem; color: var(--text-3);
    white-space: nowrap; margin-left: auto;
  }

  /* =================== ENTRY CARD =================== */
  .entry {
    padding: 1.75rem 2.5rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.2s;
  }
  .entry:hover { background: var(--hover); }
  .entry.active { background: var(--hover); }
  .entry.active::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--c-default);
  }
  .entry.hidden { display: none; }

  .entry-head {
    display: flex; align-items: center;
    gap: 0.5rem; margin-bottom: 0.2rem;
  }
  .entry-num {
    font-family: var(--serif);
    font-size: 0.82rem; font-weight: 700;
    color: var(--text-3);
  }
  .entry-tag {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.12rem 0.45rem; border-radius: 2px;
    color: #fff;
  }
  .entry-price {
    font-size: 0.75rem; font-weight: 500;
    color: var(--text-3);
  }

  .entry-title-row {
    display: flex; align-items: center;
    gap: 0.4rem; margin-bottom: 0.6rem;
  }
  .entry h2 {
    font-family: var(--serif);
    font-size: 1.3rem; font-weight: 600; line-height: 1.25;
  }
  .entry .deeplink {
    color: var(--text-3); text-decoration: none;
    font-size: 0.85rem; opacity: 0;
    transition: opacity 0.15s; flex-shrink: 0;
  }
  .entry:hover .deeplink, .entry.active .deeplink { opacity: 1; }

  .entry .desc {
    font-family: var(--serif);
    font-size: 0.95rem; line-height: 1.75;
    color: var(--text-2); margin-bottom: 1rem;
  }
  .entry-thumb-wrap {
    float: right;
    width: 140px;
    margin: 0.1rem 0 0.75rem 1.25rem;
  }
  .entry-thumb {
    width: 100%; aspect-ratio: 2/1;
    object-fit: cover; border-radius: 3px;
    display: block; background: var(--border);
  }
  .entry-thumb-placeholder {
    width: 100%; aspect-ratio: 2/1;
    border-radius: 3px; background: var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .entry-thumb-placeholder svg {
    width: 20px; height: 20px; color: var(--text-3); opacity: 0.35;
  }
  .entry-links {
    display: flex; gap: 0.6rem; align-items: center;
  }
  .entry-links a {
    font-size: 0.73rem; font-weight: 600;
    text-decoration: none; color: var(--text-2);
    display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--border); border-radius: 3px;
    transition: all 0.15s;
  }
  .entry-links a:hover { border-color: var(--text-2); background: var(--text); color: #fff; }
  .entry-links svg { width: 12px; height: 12px; }

  /* =================== MAP MARKERS =================== */
  .pin {
    color: #fff;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: pointer;
  }
  .pin.active {
    transform: scale(1.6);
    box-shadow: 0 3px 14px rgba(0,0,0,0.35);
    z-index: 1000 !important;
  }
  .pin.faded { opacity: 0.3; transform: scale(0.85); }

  .leaflet-popup-content-wrapper {
    border-radius: 4px !important;
    font-family: var(--sans) !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important;
  }
  .leaflet-popup-content {
    margin: 10px 14px !important;
    font-size: 0.82rem !important; line-height: 1.4 !important;
  }
  .leaflet-popup-content strong {
    font-family: var(--serif); font-size: 0.92rem;
    display: block; margin-bottom: 2px;
  }

  /* =================== MOBILE =================== */
  .mobile-toggle {
    display: none; position: fixed;
    bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    z-index: 50; background: var(--text);
    border-radius: 999px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .mobile-toggle button {
    font-family: var(--sans); font-size: 0.73rem;
    font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; border: none;
    padding: 0.65rem 1.2rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.3rem;
    color: #aaa; background: transparent; transition: all 0.2s;
  }
  .mobile-toggle button.active {
    color: #fff; background: var(--progress); border-radius: 999px;
  }
  .mobile-toggle button svg { width: 14px; height: 14px; }

  .card-carousel {
    display: none; position: fixed;
    bottom: 4.5rem; left: 0; right: 0; z-index: 40;
    overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 0 1rem 0.5rem; gap: 0.75rem;
    scrollbar-width: none;
  }
  .card-carousel::-webkit-scrollbar { display: none; }

  .card {
    scroll-snap-align: center;
    flex: 0 0 82vw; background: var(--text);
    color: #fff; border-radius: 10px;
    padding: 1rem 1.1rem; display: flex;
    gap: 0.75rem; align-items: flex-start;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    min-height: 110px;
  }
  .card.hidden { display: none; }
  .card-body { flex: 1; min-width: 0; }
  .card-body h3 {
    font-family: var(--serif); font-size: 1rem;
    font-weight: 600; margin-bottom: 0.2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-body .card-cat {
    font-size: 0.63rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: #aaa; margin-bottom: 0.35rem;
  }
  .card-body .card-desc {
    font-size: 0.78rem; line-height: 1.5; color: #ccc;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-thumb {
    width: 68px; height: 68px; border-radius: 6px;
    object-fit: cover; flex-shrink: 0; background: #333;
  }
  .card-links { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
  .card-links a {
    font-size: 0.68rem; font-weight: 600;
    color: var(--progress); text-decoration: none;
  }

  @media (max-width: 768px) {
    body { overflow: auto; height: auto; }
    .layout { flex-direction: column; height: auto; }
    .col-right {
      width: 100%; height: 100vh;
      position: fixed; top: 0; left: 0; z-index: 5;
    }
    .col-left {
      width: 100%; height: auto;
      overflow-y: visible; position: relative;
      z-index: 10; background: var(--bg);
    }
    .mobile-toggle { display: flex; }
    .progress-bar { display: none; }
    .intro-section { padding: 2rem 1.5rem 1rem; }
    .intro-section h1 { font-size: 1.5rem; }
    .intro-body { padding: 1.25rem 1.5rem 1.5rem; }
    .entry { padding: 1.25rem 1.5rem; }
    .entry h2 { font-size: 1.15rem; }
    .entry-thumb-wrap { width: 100px; margin-left: 1rem; }
    .filter-bar { padding: 0.55rem 1rem; top: 0; gap: 0.35rem; }
    .filter-btn { font-size: 0.65rem; padding: 0.3rem 0.7rem; }

    /* Map-view filter bar pinned to top */
    .map-filter-bar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 45;
      background: var(--bg);
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
      gap: 0.35rem;
      overflow-x: auto; scrollbar-width: none;
      align-items: center;
    }
    .map-filter-bar::-webkit-scrollbar { display: none; }
    body.view-map .map-filter-bar { display: flex; }
    body.view-map .col-right { top: 0; }

    body.view-map .col-left { display: none; }
    body.view-map .col-right { display: block; }
    body.view-map .card-carousel { display: flex; }
    body.view-map { overflow: hidden; height: 100vh; }

    body.view-list .col-right { display: none; }
    body.view-list .col-left { display: block; }
    body.view-list .card-carousel { display: none; }
    body.view-list .map-filter-bar { display: none; }
  }
</style>
</head>
<body class="view-list">

<div class="layout">
  <div class="col-left" id="colLeft">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <!-- Rendered from places.json -->
    <div id="introSection" class="intro-section"></div>
    <div id="introBody" class="intro-body"></div>

    <!-- Filter bar -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all" style="--btn-color: var(--text)">All</button>
      <span class="filter-count" id="filterCount"></span>
    </div>

    <!-- Entries render here -->
    <div id="entries"></div>
  </div>

  <div class="col-right">
    <div id="map"></div>
  </div>
</div>

<!-- Mobile map-view filter bar -->
<div class="map-filter-bar" id="mapFilterBar"></div>

<div class="card-carousel" id="cardCarousel"></div>

<div class="mobile-toggle" id="mobileToggle">
  <button id="btnList" class="active" onclick="setView('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    List
  </button>
  <button id="btnMap" onclick="setView('map')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M12 13 L12 17"/></svg>
    Map
  </button>
</div>

<script>
// ============================================
// MARKDOWN PARSER
// ============================================
function parsePlacesMd(text) {
  const [configBlock, ...entryBlocks] = text.split(/^===$/m);

  // --- Parse config section ---
  const guide = {};
  const categories = {};
  let introLines = [];
  let catLines = [];
  let section = 'meta'; // meta | intro | categories

  configBlock.split('\n').forEach(line => {
    if (line.trim() === '## Intro') { section = 'intro'; return; }
    if (line.trim() === '## Categories') { section = 'categories'; return; }

    if (section === 'meta') {
      const m = line.match(/^(\w[\w\s]*?):\s*(.+)$/);
      if (m) {
        const key = m[1].trim();
        const val = m[2].trim();
        if (key === 'Guide') guide.eyebrow = val;
        else if (key === 'Title') guide.title = val;
        else if (key === 'Subtitle') guide.deck = val;
        else if (key === 'Author') guide.byline = val;
        else if (key === 'Updated') guide.updated = val;
        else if (key === 'More Guides') {
          guide.moreGuides = [];
          const linkRe = /\[([^\]]+)\]\(([^)]+)\)/g;
          let lm;
          while ((lm = linkRe.exec(val)) !== null) {
            guide.moreGuides.push({ name: lm[1], url: lm[2] });
          }
        }
      }
    } else if (section === 'intro') {
      introLines.push(line);
    } else if (section === 'categories') {
      const cm = line.match(/^(.+?):\s*(#[0-9a-fA-F]{3,8})$/);
      if (cm) categories[cm[1].trim()] = { color: cm[2].trim() };
    }
  });

  // Split intro into paragraphs (double newline separated)
  guide.intro = introLines.join('\n').split(/\n\n+/).map(p => p.trim()).filter(Boolean);

  // --- Parse entries ---
  const entriesRaw = entryBlocks.join('===').split(/^---$/m).filter(b => b.trim());
  const places = entriesRaw.map(block => {
    const lines = block.split('\n');
    const place = { gmaps: null, instagram: null, facebook: null, image: null, price: null };
    const descLines = [];
    let foundName = false;

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) { if (foundName) descLines.push(''); return; }

      // # Name
      if (!foundName && trimmed.startsWith('# ')) {
        place.name = trimmed.replace(/^#+\s*/, '');
        place.slug = place.name.toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        foundName = true;
        return;
      }

      // - Key: Value metadata lines
      const meta = trimmed.match(/^-\s*(.+?):\s*(.+)$/);
      if (meta && descLines.filter(l => l.trim()).length === 0) {
        const key = meta[1].trim().toLowerCase();
        const val = meta[2].trim();
        if (key === 'category') place.category = val;
        else if (key === 'price') place.price = val;
        else if (key === 'location') {
          const coords = val.split(',').map(c => parseFloat(c.trim()));
          place.lat = coords[0]; place.lng = coords[1];
        }
        else if (key === 'image') place.image = val;
        else if (key === 'google maps') place.gmaps = val;
        else if (key === 'instagram') place.instagram = val;
        else if (key === 'facebook') place.facebook = val;
        return;
      }

      // Everything else is description
      descLines.push(trimmed);
    });

    place.description = descLines.join('\n').split(/\n\n+/)
      .map(p => p.trim()).filter(Boolean).join(' ');
    return place;
  }).filter(p => p.name && p.lat);

  return { guide, categories, places };
}

// ============================================
// LOAD + INIT
// ============================================
fetch('places.md')
  .then(r => r.text())
  .then(text => {
    const data = parsePlacesMd(text);
    init(data);
  })
  .catch(err => {
    document.getElementById('introSection').innerHTML =
      `<h1 style="color:#D95B43">Could not load places.md</h1><p>${err.message}</p>`;
  });

function init(data) {

const guide = data.guide;
const CATEGORIES = {};
Object.entries(data.categories).forEach(([k, v]) => {
  CATEGORIES[k] = { color: v.color, label: k };
});
function catColor(cat) { return CATEGORIES[cat]?.color || '#888'; }
const places = data.places;

// ============================================
// RENDER INTRO FROM DATA
// ============================================
const introSection = document.getElementById('introSection');
const moreGuidesHtml = guide.moreGuides?.length
  ? `<p class="more-guides">Read More San Miguel Guides by ${guide.moreGuides.map(g => `<a href="${g.url}">${g.name}</a>`).join(' and ')}</p>`
  : '';
introSection.innerHTML = `
  <div class="eyebrow">${guide.eyebrow}</div>
  <h1>${guide.title}</h1>
  <p class="deck">${guide.deck}</p>
  <p class="byline">By <strong>${guide.byline}</strong> · Updated ${guide.updated}</p>
  ${moreGuidesHtml}
`;
document.title = guide.title;

const introBodyEl = document.getElementById('introBody');
introBodyEl.innerHTML = guide.intro.map((p, i) =>
  `<p${i === 0 ? ' class="drop-cap"' : ''}>${p}</p>`
).join('');

// ============================================
// SVG ICONS
// ============================================
const I = {
  gmaps: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
  ig: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>`,
  fb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`,
  link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`
};

function linkRow(p) {
  const a = [];
  if (p.gmaps)     a.push(`<a href="${p.gmaps}" target="_blank" rel="noopener">${I.gmaps} Maps</a>`);
  if (p.instagram) a.push(`<a href="${p.instagram}" target="_blank" rel="noopener">${I.ig} IG</a>`);
  if (p.facebook)  a.push(`<a href="${p.facebook}" target="_blank" rel="noopener">${I.fb} FB</a>`);
  return a.length ? `<div class="entry-links">${a.join('')}</div>` : '';
}
function cardLinks(p) {
  const a = [];
  if (p.gmaps)     a.push(`<a href="${p.gmaps}" target="_blank">Maps</a>`);
  if (p.instagram) a.push(`<a href="${p.instagram}" target="_blank">IG</a>`);
  if (p.facebook)  a.push(`<a href="${p.facebook}" target="_blank">FB</a>`);
  return a.length ? `<div class="card-links">${a.join(' · ')}</div>` : '';
}

// ============================================
// BUILD FILTER BUTTONS (from data)
// ============================================
const filterBar = document.getElementById('filterBar');
const usedCats = [...new Set(places.map(p => p.category))];
usedCats.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.filter = cat;
  btn.style.setProperty('--btn-color', catColor(cat));
  btn.textContent = CATEGORIES[cat]?.label || cat;
  // Insert before the count span
  filterBar.insertBefore(btn, document.getElementById('filterCount'));
});

let activeFilter = 'all';

// Sync both filter bars
function syncFilterBars(clickedBtn) {
  activeFilter = clickedBtn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const isActive = b.dataset.filter === activeFilter;
    b.classList.toggle('active', isActive);
    if (isActive) {
      const col = b.dataset.filter === 'all' ? 'var(--text)' : (CATEGORIES[b.dataset.filter]?.color || '#888');
      b.style.background = col;
      b.style.borderColor = col;
    } else {
      b.style.background = '';
      b.style.borderColor = '';
    }
  });
  updateFilter();
}

filterBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  syncFilterBars(btn);
});

// Clone filter buttons into mobile map filter bar
const mapFilterBar = document.getElementById('mapFilterBar');
filterBar.querySelectorAll('.filter-btn').forEach(btn => {
  const clone = btn.cloneNode(true);
  if (btn.classList.contains('active')) {
    clone.style.background = 'var(--text)';
    clone.style.borderColor = 'var(--text)';
  }
  mapFilterBar.appendChild(clone);
});
mapFilterBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  syncFilterBars(btn);
});

// Style the initial "All" button
filterBar.querySelector('.filter-btn.active').style.background = 'var(--text)';
filterBar.querySelector('.filter-btn.active').style.borderColor = 'var(--text)';

// ============================================
// RENDER ENTRIES
// ============================================
const entriesEl = document.getElementById('entries');
const carousel = document.getElementById('cardCarousel');

places.forEach((p, i) => {
  const col = catColor(p.category);

  // Desktop entry
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.id = `entry-${p.slug}`;
  entry.dataset.index = i;
  entry.dataset.cat = p.category;

  const price = p.price ? `<span class="entry-price">[${p.price}]</span>` : '';
  const thumbHtml = p.image
    ? `<div class="entry-thumb-wrap"><img class="entry-thumb" src="${p.image}" alt="${p.name}" loading="lazy"/></div>`
    : (p.showThumb !== false ? `<div class="entry-thumb-wrap"><div class="entry-thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div></div>` : '');

  entry.innerHTML = `
    <div class="entry-head">
      <span class="entry-tag" style="background:${col}">${p.category}</span>
      ${price}
    </div>
    <div class="entry-title-row">
      <h2>${p.name}</h2>
      <a class="deeplink" href="#${p.slug}" title="Link to this spot">${I.link}</a>
    </div>
    ${thumbHtml}
    <p class="desc">${p.description}</p>
    <div style="clear:both"></div>
    ${linkRow(p)}
  `;
  entriesEl.appendChild(entry);

  // Mobile card
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `card-${i}`;
  card.dataset.index = i;
  card.dataset.cat = p.category;
  const thumb = p.image
    ? `<img class="card-thumb" src="${p.image}" alt="${p.name}"/>`
    : `<div class="card-thumb"></div>`;
  card.innerHTML = `
    <div class="card-body">
      <div class="card-cat">${p.category}${p.price ? ' · ' + p.price : ''}</div>
      <h3>${p.name}</h3>
      <p class="card-desc">${p.description}</p>
      ${cardLinks(p)}
    </div>
    ${thumb}
  `;
  card.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') return;
    setActive(i, 'card');
  });
  carousel.appendChild(card);
});

// ============================================
// MAP
// ============================================
const map = L.map('map', { zoomControl: true, scrollWheelZoom: true })
  .setView([20.9160, -100.7440], 15);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);
const markerRefs = [];

places.forEach((p, i) => {
  const col = catColor(p.category);
  const icon = L.divIcon({
    className: '',
    html: `<div class="pin" id="pin-${i}" style="background:${col}" data-index="${i}"></div>`,
    iconSize: [18, 18], iconAnchor: [9, 9]
  });
  const marker = L.marker([p.lat, p.lng], { icon }).addTo(markerLayer);
  marker.on('click', () => setActive(i, 'map'));
  markerRefs.push(marker);
});

// ============================================
// SYNC
// ============================================
let activeIndex = -1;
let lockSource = null;
let lockTimer = null;

function acquireLock(source, ms) {
  lockSource = source;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { lockSource = null; }, ms);
}

function setActive(index, source) {
  if (index < 0 || index >= places.length) return;
  if (index === activeIndex && source === 'scroll') return;
  activeIndex = index;

  // Highlight entries
  document.querySelectorAll('.entry').forEach((el, i) => {
    el.classList.toggle('active', i === index);
    if (i === index) {
      el.style.setProperty('--c-default', catColor(places[i].category));
      el.querySelector('::before')
    }
  });
  // Correct the active bar color
  const activeEntry = document.querySelector('.entry.active');
  if (activeEntry) activeEntry.style.borderLeftColor = catColor(places[index].category);

  // Highlight pins
  document.querySelectorAll('.pin').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  // Fly map
  map.flyTo([places[index].lat, places[index].lng], 16, { duration: 0.7 });

  // Scroll list on marker click
  if (source === 'map') {
    acquireLock('map', 1200);
    const el = document.getElementById(`entry-${places[index].slug}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Scroll carousel
  if (source === 'map' || source === 'list') {
    const card = document.getElementById(`card-${index}`);
    if (card) {
      acquireLock('carousel', 800);
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  // Update hash
  history.replaceState(null, '', `#${places[index].slug}`);
}

// ============================================
// SCROLL OBSERVER
// ============================================
const colLeft = document.getElementById('colLeft');
const progressFill = document.getElementById('progressFill');

const observer = new IntersectionObserver((entries) => {
  if (lockSource === 'map' || lockSource === 'carousel') return;
  let best = null;
  entries.forEach(e => {
    if (e.isIntersecting && e.intersectionRatio >= 0.45) {
      if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
    }
  });
  if (best) {
    const idx = parseInt(best.target.dataset.index);
    if (!isNaN(idx) && idx !== activeIndex) setActive(idx, 'scroll');
  }
}, { root: colLeft, threshold: [0.45, 0.6, 0.8] });

document.querySelectorAll('.entry').forEach(el => observer.observe(el));

// Progress bar
colLeft.addEventListener('scroll', () => {
  const t = colLeft.scrollTop;
  const h = colLeft.scrollHeight - colLeft.clientHeight;
  progressFill.style.width = (h > 0 ? (t / h) * 100 : 0) + '%';
});

// Carousel swipe detection
let carouselTimer;
carousel.addEventListener('scroll', () => {
  if (lockSource === 'carousel') return;
  clearTimeout(carouselTimer);
  carouselTimer = setTimeout(() => {
    const cx = carousel.scrollLeft + carousel.clientWidth / 2;
    let closest = 0, dist = Infinity;
    carousel.querySelectorAll('.card:not(.hidden)').forEach(card => {
      const d = Math.abs((card.offsetLeft + card.offsetWidth / 2) - cx);
      if (d < dist) { dist = d; closest = parseInt(card.dataset.index); }
    });
    if (closest !== activeIndex) setActive(closest, 'carousel-swipe');
  }, 100);
});

// ============================================
// FILTER
// ============================================
const filterCount = document.getElementById('filterCount');

function updateFilter() {
  let visible = 0;

  places.forEach((p, i) => {
    const show = activeFilter === 'all' || p.category === activeFilter;
    // entries
    const entry = document.getElementById(`entry-${p.slug}`);
    entry.classList.toggle('hidden', !show);
    // cards
    const card = document.getElementById(`card-${i}`);
    card.classList.toggle('hidden', !show);
    // pins
    const pin = document.getElementById(`pin-${i}`);
    if (pin) {
      pin.classList.toggle('faded', !show);
      pin.style.pointerEvents = show ? 'auto' : 'none';
    }
    if (show) visible++;
  });

  filterCount.textContent = `${visible} spot${visible !== 1 ? 's' : ''}`;

  // Re-observe only visible entries
  observer.disconnect();
  document.querySelectorAll('.entry:not(.hidden)').forEach(el => observer.observe(el));

  // Fit map to visible markers
  const visibleCoords = places
    .filter((p, i) => !document.getElementById(`pin-${i}`)?.classList.contains('faded'))
    .map(p => [p.lat, p.lng]);
  if (visibleCoords.length) {
    map.fitBounds(visibleCoords, { padding: [40, 40], maxZoom: 16, duration: 0.6 });
  }
}

updateFilter(); // initial

// ============================================
// MOBILE VIEW
// ============================================
window.setView = function(mode) {
  document.body.className = `view-${mode}`;
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  document.getElementById('btnMap').classList.toggle('active', mode === 'map');
  if (mode === 'map') {
    setTimeout(() => {
      map.invalidateSize();
      if (activeIndex >= 0) map.flyTo([places[activeIndex].lat, places[activeIndex].lng], 16, { duration: 0.5 });
    }, 100);
  }
}

// ============================================
// DEEP LINKS
// ============================================
function handleHash() {
  const h = window.location.hash.slice(1);
  if (h) {
    const idx = places.findIndex(p => p.slug === h);
    if (idx >= 0) { setTimeout(() => setActive(idx, 'map'), 400); return; }
  }
  // default: activate first visible entry
  const first = document.querySelector('.entry:not(.hidden)');
  if (first) setTimeout(() => setActive(parseInt(first.dataset.index), 'scroll'), 300);
}
handleHash();
window.addEventListener('hashchange', handleHash);

} // end init()
</script>
</body>
</html>
